[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pictor"
version = "0.1.0"
description = "A free local AI artist for Russian and English prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai==1.109.1",
  "Pillow==11.3.0",
  "python-dotenv==1.1.1",
  "torch==2.8.0",
  "diffusers==0.35.1",
  "transformers==4.56.1",
  "accelerate==1.10.1",
  "safetensors==0.6.2",
]

[project.scripts]
pictor = "pictor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
