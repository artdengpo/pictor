[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pictor"
version = "0.1.0"
description = "A bilingual terminal AI artist for Russian and English users"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai==1.109.1",
  "Pillow==11.3.0",
  "python-dotenv==1.1.1",
]

[project.scripts]
pictor = "pictor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
